<!DOCTYPE html>
<html lang="en">
    <head>
        <title>my javascript.</title> 
        <style>
            html{scroll-behavior:smooth;}
            body{background-color: rgb(81, 159, 254); background-image: url('https://tse2.mm.bing.net/th/id/OIP.5zylpQVBpz2dCZ-KO_mUgwHaEK?rs=1&pid=ImgDetMain&o=7&rm=3'); background-position: center; background-attachment: scroll;}
            section{background-color: rgb(255, 255, 255); color: rgb(0, 0, 255); padding: 1.5em;}
            footer{background-color: black; padding:10px; border-bottom: 5px;  margin-bottom: 0px;}
            .column1of3{float: left; background-color: rgb(218, 211, 211); width: 300px;height: 400px; color: rgb(0, 0, 0); padding:10px; 
                background-image: url('https://www.pngmagic.com/product_images/beautiful-nature-background-for-websites-free_45w.jpg');background-position: center; background-attachment: scroll;}
            .column2of3{float: left; background-color: rgb(150, 163, 220); width: 300px; color: rgb(0, 0, 0); padding:10px; background-image: url('https://tse3.mm.bing.net/th/id/OIP.HiOvA0uMqqv2XSCGtJfWPAHaHa?w=512&h=512&rs=1&pid=ImgDetMain&o=7&rm=3');  background-position: center; background-attachment: scroll;}
            .column3of3{float: left; background-color: rgb(94, 129, 147); width: 500px; color: rgb(0, 0, 0); padding:10px;}
            p{color:rgb(255, 0, 0);}
            .photorow{display: flex; justify-content: left; gap: 2px;}
            @keyframes brightPulse{
                0%{filter: brightness(0.5);}
                50%{filter: brightness(2.0);}
                100%{filter: brightness(0.5);}
            }
            .pulse{animation:brightPulse 10s ease-in-out infinite;}
            @keyframes pulse{
                0%{transform: rotateY(180deg);}
                50%{transform: rotateX(-95.5deg);}
                100%{transform: rotateY(180deg);}
            }
            .ball{animation: pulse 10s infinite; background-color: rgb(241, 149, 0); width: 80px; height: 80px;
                 border-radius: 50%; box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);}
            @media screen and (max-width:768px) {
                *{font-size: clamp(10px, 2.9vw, 40px);}
                body{width: 90%; padding: 10px; font-size: clamp(15px, 4vw, 40px);}
                .column1of3{width: 100%;float: none; height: 25vh;}
                .column2of3{width: 100%;float: none; height: 14vh;}
                .column3of3{width: 100%;float: none; height: 10vh;}
                .photorow{gap: 0.125em; flex: auto;}
            }
            @media(max-width:600px){
                *{font-size:clamp(10px, 4vw, 25px);}
                section{padding: 1rem;flex-direction:column;height: auto; width: 90%;}
                html{scroll-behavior: smooth;}
                img{width: 90%; height: auto;}
            }
        </style>
    </head>
    <body>
        <img style="border-radius:100px;float:left;padding:0px;"src="https://tse4.mm.bing.net/th/id/OIP.vKdb4d4faiYKNrF-ogbSUwAAAA?rs=1&pid=ImgDetMain&o=7&rm=3" width="100px" height="90">
        <br/> &nbsp;&nbsp;
        <h1 style="color:rgb(255, 250, 250);">Measurements converter</h1>
        <br/>
        <br/>
        <section>
        <div class="pulse">
            <div class="column1of3">
             <div class="ball"></div>
           </div>
         </div>
       <div class="column2of3">
        <h2>Clock Timer</h2>
        <p class="currentTime"></p>
       </div>
       <div class="column3of3">
        <div class="photorow">
        <img src="https://tse2.mm.bing.net/th/id/OIP.bjNgt3B61Mno3AXwMQBdfwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"width="100px" height="90px">
        <img src="https://public-files.gumroad.com/6em7kmb09bonhsfh1nug9tred99v"width="100px" height="90px">
        <img src="https://tse1.mm.bing.net/th/id/OIP.pXrq6xy_Gxua3qTfGZLXqwHaKc?rs=1&pid=ImgDetMain&o=7&rm=3"width="100px" height="90px">
        <img src="https://tse3.mm.bing.net/th/id/OIP.nEHLbFP5Ry6tryQxUEgLUQHaKd?rs=1&pid=ImgDetMain&o=7&rm=3"width="100px" height="90px">
        <img src="https://tse2.mm.bing.net/th/id/OIP.dtNE8IQSVDx0zNH7JJPWBwAAAA?w=438&h=438&rs=1&pid=ImgDetMain&o=7&rm=3"width="100px" height="90px">
        </div>
        </div>
         <br/>
        <br/>
          <!-- the html -->
         <h1>The simple converter.</h1>
        <div style="display: flex;">
            <div style="flex: auto; padding: 0.3125rem;">
                <h2>grams to kilogram converter</h2>
        <!-- for grams -->
        <label for = "grams">Enter grams:</label>
        <input type = "number" id="grams" placeholder="e.g:5000g..">
        <button onclick = "convertGrams()">convert</button>
        <p id="result" class="p"></p>
        <h2>centimeters to feets converter</h2>
    <!-- for centimeters -->
        <label for="centimeters">Enter centimeters:</label>
        <input type="number" id="centimeters" placeholder="e.g 170cm...">
        <button onclick="convertCentimeters()">convert</button>
        <p id="results"></p>
        <!-- the currency converter -->
            <label for="currency">Convert currency:</label>
            <input type="number" id="currency" placeholder="e.g:500$..">
            <button onclick="convertCurrency()">convert</button>
            <p id="results"></p>
         </div>
        <div>
    <!-- the act of BMI -->
     <h2>BMI calculator</h2>
      <label for="weight">your weight:</label>
    <input type="number" id="weight" placeholder="your weight">

    <label for="height">your height:</label>
    <input type="number" id="height" placeholder="your height">

    <button onclick="calculateBmi()">calculate</button>
    <p id="results"></p>
    <!-- the time converter -->
     <h2>time converter</h2>
     <label for="hour">convert hours:</label>
     <input type="number" id="hours" placeholder="e.g:2hrs....">
     <button onclick="changeHour()">convert</button>
     <p id="results"></p>
     
     <!-- the seconds in years -->
      <label for="years">how many seconds in years:</label>
      <input type="number" id="years" placeholder="e.g:5yrs....">
      <button onclick="calculateYears()">calculate seconds</button>
      <p id="results"></p>
    <!-- my JavaScript -->
    </div>
    
       </section>
       <P style="color: white;">This is my first converting website where one is allowed to use it wherever they are. </P>
    <script>
    /* this is clock*/
    function updateTime(){
                const now= new Date();
                const timeString= now.toLocaleTimeString();
                document.querySelector(".currentTime").innerHTML= `<h2 style="color:white;">clock ${timeString}</h2>`;
            }
            updateTime();
            setInterval(updateTime,1000);
        /*grams converter*/
        
    function convertGrams() {
        let grams = document.getElementById("grams").value;
        let kilograms = grams/1000.0;
        document.getElementById("result").innerHTML = grams + "grams=" + kilograms.toFixed(2) + "kilograms";
    }
    /*feet converter*/
    function convertCentimeters() {
        let centimeters=document.getElementById("centimeters").value;
        let feet= centimeters / 30.48;
        document.getElementById("result").innerHTML=centimeters + "centimeters=" + feet.toFixed(2) + "feet";
    }
/* the BMI calculator*/
    function calculateBmi(){
        let weight= Number(document.getElementById("weight").value);
        let height= Number(document.getElementById("height").value);
        let bmi=weight/(height**2);
        document.getElementById("results").innerHTML="BMI=" + bmi.toFixed(2);
    }
/*the hour to seconds converter*/ 
    function changeHour(){
        let hours= document.getElementById("hours").value;
        let seconds= hours * 3600;
        document.getElementById("results").innerHTML= hours + "hours=" + seconds.toFixed(2) + "seconds";
    }
/*the seconds in years*/
    function calculateYears(){
        let years= document.getElementById("years").value;
        let seconds= years * 31536000;
        document.getElementById("results").innerHTML= years + "years=" + seconds.toFixed(2) + "seconds";
    }
    /*currency converter*/
    function convertCurrency(){
        let currency= document.getElementById("currency").value;
        let frw= currency * 1455.62;
        document.getElementById("results").innerHTML= currency + "$=" + frw.toFixed(2) + "frw";
    }

    </script>  
    <hr>
    <footer>
        <p style="color:rgb(255, 255, 255); text-align: center;">&copy;2026 allrights reserved Clement ader's version.</p>
    </footer>  
    </body>
</html>
